<!doctype html><html><head><meta charset="utf-8"><title>Apply – Hardware Intern (mock Lever)</title></head><body>
<h2>Submit your application</h2>
<form id="f" action="thanks.html" method="get">
<div class="application-question"><div class="application-label">Resume/CV ✱</div><input type="file" name="resume" required></div>
<div class="application-question"><div class="application-label">Full name ✱</div><input type="text" name="name" required></div>
<div class="application-question"><div class="application-label">Email ✱</div><input type="email" name="email" required></div>
<div class="application-question"><div class="application-label">Phone</div><input type="text" name="phone"></div>
<div class="application-question"><div class="application-label">Current company</div><input type="text" name="org"></div>
<div class="application-question"><div class="application-label">LinkedIn URL</div><input type="text" name="urls[LinkedIn]"></div>
<div class="application-question"><div class="application-label">Will you now or in the future require visa sponsorship?</div><select name="cards[0][field0]"><option value="">Select…</option><option>Yes</option><option>No</option></select></div>
<div class="application-question"><div class="application-label">Why do you want to join us?</div><textarea name="cards[0][field1]"></textarea></div>
<div class="application-question"><div class="application-label">Gender</div><select name="eeo[gender]"><option value="">Select…</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div>
<label><input type="checkbox" name="consent" required> I agree to the privacy policy</label>
<button type="submit">Submit application</button>
</form></body></html>
