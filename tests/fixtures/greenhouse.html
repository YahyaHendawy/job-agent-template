<!doctype html><html><head><meta charset="utf-8"><title>Job Application (mock Greenhouse)</title></head><body>
<form id="application_form" action="thanks.html" method="get">
<div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" required></div>
<div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" required></div>
<div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
<div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
<div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file"></div>
<div class="field"><label for="cover_letter">Cover Letter</label><input id="cover_letter" name="cover_letter" type="file"></div>
<div class="field"><label for="q1">LinkedIn Profile</label><input id="q1" type="text"></div>
<div class="field"><label for="q2">School</label><input id="q2" type="text"></div>
<div class="field"><label for="q3">Expected graduation year</label><input id="q3" type="text"></div>
<div class="field"><label for="q4">Are you legally authorised to work in the United Kingdom?</label><select id="q4"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
<fieldset><legend>Do you hold a full driving licence?</legend><label><input type="radio" name="q5" value="y"> Yes</label><label><input type="radio" name="q5" value="n"> No</label></fieldset>
<div class="field"><label for="q6">How did you hear about this job?</label><input id="q6" type="text"></div>
<div class="field"><label for="q7">Tell us about a project you are proud of</label><textarea id="q7"></textarea></div>
<div class="field"><label for="eth">Ethnicity</label><select id="eth"><option value="">Please select</option><option>White</option><option>Asian</option><option>I don't wish to answer</option></select></div>
<input type="submit" value="Submit Application">
</form></body></html>
